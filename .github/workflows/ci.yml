name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio:latest server /data
          # Wait for MinIO to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            echo "Waiting for MinIO... ($i)"
            sleep 2
          done

      - name: Create S3 test bucket
        run: |
          docker exec minio mc alias set local http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb local/sorted-test

      - name: Run unit tests
        env:
          REDIS_URL: localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: sorted-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_USE_PATH_STYLE: "true"
        run: go test ./... -v -count=1

      - name: Run integration tests
        env:
          REDIS_URL: localhost:6379
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: sorted-test
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_ACCESS_KEY_ID: minioadmin
          S3_SECRET_ACCESS_KEY: minioadmin
          S3_USE_PATH_STYLE: "true"
        run: go test -tags integration ./... -v -count=1

      - name: Vet
        run: go vet ./...
